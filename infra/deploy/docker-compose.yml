# Ambiente de homologação num servidor compartilhado.
#   cd infra/deploy && docker compose --env-file .env up -d --build
# Segredos ficam em infra/deploy/.env (fora do git); veja .env.example.
# O banco não expõe porta no host; o Mailpit só escuta em 127.0.0.1 (acesso por túnel SSH).
name: condo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8716}:8025'

  # Filas (BullMQ). Sem porta no host; AOF ligado para não perder jobs num reinício.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Comprovantes. Sem porta no host. A MinIO não publica mais imagens no Docker Hub; a da
  # Chainguard é mínima (sem shell), então a API cria o bucket versionado na subida.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: condo-minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - miniodata:/data

  # Papéis de banco + migrações. Único serviço com a credencial de superusuário.
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: condo-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      DATABASE_OWNER_URL: postgres://app_owner:${DB_OWNER_PASSWORD:?}@postgres:5432/condo
      DATABASE_URL: postgres://app_user:${DB_APP_PASSWORD:?}@postgres:5432/condo
      DATABASE_PLATFORM_URL: postgres://app_platform:${DB_PLATFORM_PASSWORD:?}@postgres:5432/condo
    command: sh -c "node dist/db/scripts/bootstrap.js && node dist/db/scripts/migrate.js"
    restart: 'no'

  api:
    image: condo-api:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DEPLOY_ENV: homolog
      PORT: 3333
      REDIS_URL: redis://redis:6379
      APP_API_URL: ${APP_API_URL:?}
      # Homologação usa o broker simulado; para o sandbox do Asaas, troque e informe a chave.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      ASAAS_ROOT_API_KEY: ${ASAAS_ROOT_API_KEY:-}
      PLATFORM_FEE_CENTAVOS: ${PLATFORM_FEE_CENTAVOS:-0}
      LOG_LEVEL: info
      TRUST_PROXY: 'false'
      DATABASE_URL: postgres://app_user:${DB_APP_PASSWORD}@postgres:5432/condo
      DATABASE_PLATFORM_URL: postgres://app_platform:${DB_PLATFORM_PASSWORD}@postgres:5432/condo
      JWT_SECRET: ${JWT_SECRET:?}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}
      SMTP_URL: smtp://mailpit:1025
      APP_WEB_URL: ${APP_WEB_URL:?}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: condo-attachments
      S3_ACCESS_KEY_ID: condo-minio
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ENSURE_BUCKET: 'true'
    ports:
      - '${API_BIND:-0.0.0.0}:${API_PORT:-8700}:3333'

  # Painel e portal do morador. Fala com a API pela rede interna (BFF).
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: condo-web:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:3333
      # Homologação por HTTP: cookie sem `secure`. Com HTTPS, troque para true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8701}:3000'

volumes:
  pgdata:
  miniodata:
  redisdata:
